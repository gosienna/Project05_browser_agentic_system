<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Browser Agent</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="tabs">
        <button class="tab-btn" data-tab="dialogue">Dialogue</button>
        <button class="tab-btn active" data-tab="agent">Agent</button>
      </div>
      <button id="settings-icon-btn" type="button" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
    </header>

    <section id="onboarding" class="onboarding hidden">
      <h2>Welcome — pick an engine</h2>
      <button id="ob-onnx" class="ob-card">
        <strong>Built-in engine</strong>
        <span>No setup. Downloads a model (~0.7–2 GB) once, then runs fully offline.</span>
      </button>
      <button id="ob-ollama" class="ob-card">
        <strong>Ollama</strong>
        <span id="ob-ollama-status">Checking for a local Ollama server…</span>
      </button>
      <button id="ob-api" class="ob-card">
        <strong>API key</strong>
        <span>OpenAI, Anthropic, or a custom OpenAI-compatible endpoint.</span>
      </button>
    </section>

    <main>
      <section id="tab-dialogue" class="tab-panel">
        <div class="dialogue-model-row">
          <label for="dialogue-model-select">Model</label>
          <select id="dialogue-model-select" aria-label="Chat model"></select>
        </div>
        <button id="dialogue-system-toggle" type="button" class="secondary-btn">⚙ System prompt</button>
        <div id="dialogue-system-wrap" class="hidden">
          <textarea id="dialogue-system-input" rows="3" placeholder="System prompt / instructions… (optional)"></textarea>
        </div>
        <div id="dialogue-chat" class="dialogue-chat"></div>
        <form id="dialogue-form">
          <textarea id="dialogue-input" placeholder="Type a message…" rows="2"></textarea>
          <button type="submit" id="dialogue-send-btn">Send</button>
        </form>
      </section>

      <section id="tab-agent" class="tab-panel active">
        <div class="system-row">
          <label class="system-select-label" for="system-select">System</label>
          <select id="system-select" aria-label="Agent system"></select>
          <button id="system-add-btn" type="button" class="icon-btn" title="Create system" aria-label="Create system">+</button>
          <button id="system-delete-btn" type="button" class="icon-btn" title="Delete system" aria-label="Delete system">🗑</button>
          <a id="system-open-link" class="system-open-link" href="#" target="_blank" rel="noopener">Open full page</a>
          <a id="system-components-link" class="system-open-link" href="#" target="_blank" rel="noopener">Components</a>
        </div>
        <div id="model-badge" class="model-badge"></div>
        <iframe id="system-home-frame" class="system-home-frame" title="System home"></iframe>
        <div id="browser-agent-run" class="browser-agent-run hidden">
          <div class="mode-label">Run automation</div>
          <form id="agent-form">
            <textarea id="task-input" placeholder="What should the browser agent do? e.g. Summarize this page in 5 bullets" rows="2"></textarea>
            <button type="submit" id="run-btn">Run</button>
          </form>
        </div>
        <div class="mode-label">Edit components (LLM)</div>
        <div id="editor-level-badge" class="level-badge" title="Fixed when the system was created"></div>
        <div id="trace" class="trace"></div>
        <form id="editor-form">
          <textarea id="editor-input" placeholder="Ask to change this system… e.g. Make the curve red, or plot two curves at once" rows="2"></textarea>
          <button type="submit" id="editor-run-btn">Edit</button>
        </form>

        <div class="history-header">
          <span class="mode-label">Conversation history</span>
          <button id="history-clear-btn" type="button" class="secondary-btn" title="Delete all stored runs for this system">Clear</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>

    </main>

    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="modal-header">
          <h2>Settings</h2>
          <button id="settings-close-btn" type="button" class="icon-btn" aria-label="Close">✕</button>
        </div>
        <div id="tab-settings" class="modal-body">
          <label for="provider-select">Provider</label>
          <select id="provider-select">
            <option value="onnx">Built-in (ONNX, runs in your browser)</option>
            <option value="ollama">Ollama</option>
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic</option>
            <option value="openai-compatible">OpenAI-compatible / custom</option>
          </select>

          <div id="onnx-settings" class="provider-block hidden">
            <div id="onnx-device" class="device-line">Device: unknown</div>

            <h3 class="onnx-section-title">Chat model (LLM)</h3>
            <ul id="onnx-registry" class="onnx-registry"></ul>

            <h3 class="onnx-section-title">Image captioning</h3>
            <ul id="onnx-registry-caption" class="onnx-registry"></ul>

            <h3 class="onnx-section-title">Image classification</h3>
            <ul id="onnx-registry-classify" class="onnx-registry"></ul>

            <h3 class="onnx-section-title">Speech transcription</h3>
            <ul id="onnx-registry-asr" class="onnx-registry"></ul>

            <div id="onnx-progress-wrap" class="hidden">
              <div class="progress-bar"><div id="onnx-progress-fill"></div></div>
              <div id="onnx-progress-label"></div>
            </div>
            <button id="onnx-unload-btn" type="button">Unload all models</button>
            <button id="onnx-clear-cache-btn" type="button">Clear model cache</button>
            <div id="onnx-cache-hint" class="device-line"></div>
          </div>

          <div id="remote-settings" class="provider-block hidden">
            <label for="base-url">Base URL</label>
            <input id="base-url" placeholder="e.g. http://localhost:11434 or https://api.openai.com/v1" />
            <label for="api-key">API key</label>
            <input id="api-key" type="password" placeholder="(not needed for Ollama)" />
            <label for="model-name">Model</label>
            <input id="model-name" placeholder="e.g. llama3.2, gpt-4o-mini, claude-sonnet-5" />
          </div>

          <button id="test-connection-btn" type="button">Test connection</button>
          <span id="test-connection-result"></span>
        </div>
      </div>
    </div>

    <div id="history-modal" class="modal-overlay hidden">
      <div class="modal" role="dialog" aria-modal="true" aria-label="Conversation transcript">
        <div class="modal-header">
          <h2 id="history-modal-title">Transcript</h2>
          <button id="history-modal-close-btn" type="button" class="icon-btn" aria-label="Close">✕</button>
        </div>
        <div id="history-modal-body" class="modal-body history-transcript"></div>
      </div>
    </div>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Agent System</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f0f0f0; }
      #frame {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #fff;
      }
      #status {
        position: fixed;
        left: 8px;
        bottom: 8px;
        font: 11px/1.3 system-ui, sans-serif;
        color: #666;
        background: rgba(255,255,255,0.9);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
      }
      #status.error { color: #a02525; }
    </style>
  </head>
  <body>
    <iframe id="frame" src="sandbox.html"></iframe>
    <div id="status">Loading…</div>
    <script src="system-host.js" type="module"></script>
  </body>
</html>

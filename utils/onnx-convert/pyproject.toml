[project]
name = "onnx-convert"
version = "0.1.0"
description = "Convert Hugging Face Transformers checkpoints into transformers.js–compatible ONNX packages."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.53.0",
    "accelerate>=1.0.0",
    "huggingface-hub>=0.26.0",
    "safetensors>=0.4.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "onnxslim>=0.1.34",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "onnxscript>=0.7.1",
]

[project.scripts]
onnx-convert = "onnx_convert.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
